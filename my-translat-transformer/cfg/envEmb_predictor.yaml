# Dataset
random_split: True
split_tr_tst_val: [0.2, 0.65, 0.15]
# split_tr_tst_val: [0.01, 0.98, 0.01]
translate_earlybreaks: [50, 50, 50]
split_ran_seed: 42

# Training
device: 'cuda'
bs: 8
optimizer: 'adamw'
scheduler: 'seqlr_w'
use_scheduler: True
lr: 0.001
momentum: 0.9
final_lr: 0.000001
wd: 0.001 #weight_decay
num_epochs: 200
break_training: 200

# [LIN --sched]
opt_factor: 0.99 
patience: 15

# [COS --sched]
# "epochs": config above,
eta_min: 0.00001
last_epoch: -1
verbose: False

# [COSW --sched]
first_cycle_steps: 60
cycle_mult: 1.0
min_lr: 1.5e-6
max_lr: 0.001
warmup_steps: 8
gamma: 1.0

# Architecture
pos_encoding_type: 'sin' # simple or sin
drop_p: 0.1
n_heads: 2
context_len: 123
h_dim: 32
n_blocks: 2
B: 10
T: 120

# Save and Evaluate
eval_inerval: 2
chkpt_interval: 5
chkpt_list: []
translate_earlybreaks: [2, 2, 2] #tr, test, val